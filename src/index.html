<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Gestão Escolar</title>
<meta name="description" content="Painel de gestão para escola particular: financeiro, alunado, rematrícula, farol e funil de matrículas. Dados fictícios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230f172a'/%3E%3Cpath d='M9 27a11 11 0 0 1 22 0' fill='none' stroke='%230ea5e9' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M7 31h26' stroke='%23f59e0b' stroke-width='3.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='16' r='3.6' fill='%23f59e0b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
/*CSS*/
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0f172a"/><path d="M9 27a11 11 0 0 1 22 0" fill="none" stroke="#0ea5e9" stroke-width="3.4" stroke-linecap="round"/><path d="M7 31h26" stroke="#f59e0b" stroke-width="3.4" stroke-linecap="round"/><circle cx="20" cy="16" r="3.6" fill="#f59e0b"/></svg>
      <div>
        <h1>Gestão · <span id="nomeEscola"></span></h1>
        <p>Financeiro · Alunado · Rematrícula · Farol · Funil <span class="selo">dados fictícios</span></p>
      </div>
    </div>
    <div class="topo-acoes">
      <button class="btn" id="btnCompleta" data-modo="tv">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        Exibição completa
      </button>
      <button class="btn" id="btnIpad" data-modo="ipad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        iPad
      </button>
      <span class="atualizado">Posição de <b id="dataRef"></b></span>
      <button class="btn-icone" id="btnTema" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg class="ico-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <nav class="abas" id="abas">
    <button data-aba="financeiro" class="c-fin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Financeiro</button>
    <button data-aba="alunado" class="c-alu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>Alunado</button>
    <button data-aba="rematricula" class="c-rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>Rematrícula</button>
    <button data-aba="farol" class="c-far"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M8 5h8M9 8h6l-1 12h-4z"/><path d="M6 10l-3-1M18 10l3-1M7 20h10"/></svg>Farol</button>
    <button data-aba="funil" class="c-fun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg>Funil</button>
  </nav>
</header>

<main>
  <section class="aba" id="aba-financeiro"></section>
  <section class="aba" id="aba-alunado"></section>
  <section class="aba" id="aba-rematricula"></section>
  <section class="aba" id="aba-farol"></section>
  <section class="aba" id="aba-funil"></section>
</main>

<footer class="rodape">Projeto de portfólio. Todos os números, nomes e empresas são fictícios, gerados por script com seed fixa.</footer>

<div class="apres" id="apres" hidden>
  <div class="palco" id="palco"></div>
  <div class="ctrl">
    <button id="apPausa" title="Pausar (espaço)">
      <svg class="ico-pausa" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="apFechar" title="Fechar (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<div class="painel-lateral" id="lateral" hidden>
  <div class="lateral-fundo" data-fechar></div>
  <aside class="lateral-caixa"><button class="lateral-x" data-fechar aria-label="Fechar">×</button><div id="lateralCorpo"></div></aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" crossorigin=""></script>
<script>
/*JS*/
</script>
</body>
</html>
